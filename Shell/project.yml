# XcodeGen spec for the Jarvis iOS app and its simulator QA harness.
#
#   cd Shell && xcodegen generate      # writes Jarvis.xcodeproj (gitignored)
#
# Fixed names (CI depends on them): project Jarvis, app target Jarvis (dev.jarvis.app),
# UI-test target JarvisUITests (dev.jarvis.app.uitests), shared scheme Jarvis.
#
# Jarvis's own runner (docs/JARVIS-RUNNER.md): the UI-test target JarvisRunner
# (dev.jarvis.app.runner) serves the typed tree to the app over authenticated loopback.
# It shares App/RunnerXCUITest (the XCUITest runner) with JarvisUITests and
# App/RunnerNetwork (loopback TCP) with both test bundles and the app. The Jarvis scheme
# builds it for testing but never runs it; its own scheme JarvisRunner runs it with
# JARVIS_RUNNER_SERVE=1.
#
# The local package is this directory (Package.swift): products JarvisKit and JarvisCore.
# Its JarvisCoreFFI.xcframework must exist first (scripts/bootstrap.sh on a Mac).
#
# Language mode: the app and the UI tests use Swift 5 mode with complete concurrency
# checking as warnings (JarvisKit itself is Swift 6). XCTest's UI APIs are main-actor
# bound and this code has never been compiled before CI, so strict-mode errors would make
# untestable code risky; the code is still written main-actor-correct.

name: Jarvis
options:
  bundleIdPrefix: dev.jarvis
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # >>> FILL IN for a real device: your Apple ID team (Xcode > Settings > Accounts).
    # A free Apple ID works (7-day profiles). Simulator builds need nothing here, and
    # CI passes CODE_SIGNING_ALLOWED=NO.
    DEVELOPMENT_TEAM: ""
    # <<<
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  JarvisKit:
    path: .

targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: App/Jarvis
      - path: App/RunnerNetwork
    info:
      path: App/Generated/Jarvis-Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Plain http to the runner (127.0.0.1:8300) and a model server on the local
        # network. Loopback needs no local-network permission prompt.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Remote control: a TCP listener advertised over Bonjour, local network only
        # (NetworkRemoteTransport). The prompt appears when the owner turns it on, or when
        # "Control another phone" looks for phones on the Wi-Fi (NetworkRemoteDialer,
        # RemotePhoneBrowser: the same service type, local network only).
        NSLocalNetworkUsageDescription: "Jarvis uses your local network only for Remote control: to listen for your paired devices when you turn it on, and to find and control another iPhone running Jarvis when you open Control another phone."
        NSBonjourServices:
          - _jarvis-remote._tcp
        # Probe round 3 (Playground fixture screens only, App/Jarvis/Playground/ProbeFixtures3.swift):
        # the simulator probes raise each permission prompt once to record its tree. A request
        # without its usage description crashes the app, so every permission asked has its key.
        # Jarvis itself asks for none of these outside the Playground.
        NSLocationWhenInUseUsageDescription: "Only the QA Playground asks for this, to record the system prompt in simulator tests."
        NSCameraUsageDescription: "Only the QA Playground asks for this, to record the system prompt in simulator tests."
        NSMicrophoneUsageDescription: "Only the QA Playground asks for this, to record the system prompt in simulator tests."
        NSContactsUsageDescription: "Only the QA Playground asks for this, to record the system prompt in simulator tests."
        NSPhotoLibraryUsageDescription: "Only the QA Playground asks for this, to record the system prompt in simulator tests."
        NSPhotoLibraryAddUsageDescription: "Only the QA Playground asks for this, to record the system prompt in simulator tests."
        NSUserTrackingUsageDescription: "Only the QA Playground asks for this, to record the system prompt in simulator tests."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jarvis.app
        PRODUCT_NAME: Jarvis
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: JarvisKit
        product: JarvisKit
      - package: JarvisKit
        product: JarvisCore
      # Linked explicitly so appintentsmetadataprocessor extracts AskJarvisIntent and the
      # App Shortcuts (without it: "Metadata extraction skipped. No AppIntents.framework
      # dependency found.", and Siri/Shortcuts never see the intent).
      - sdk: AppIntents.framework

  JarvisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/JarvisUITests
      - path: App/RunnerXCUITest
      - path: App/RunnerNetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jarvis.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jarvis
    dependencies:
      - target: Jarvis
      - package: JarvisKit
        product: JarvisKit
      - package: JarvisKit
        product: JarvisCore

  JarvisRunner:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/JarvisRunner
      - path: App/RunnerXCUITest
      - path: App/RunnerNetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jarvis.app.runner
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jarvis
    dependencies:
      - target: Jarvis
      - package: JarvisKit
        product: JarvisKit
      - package: JarvisKit
        product: JarvisCore

schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisUITests: [test]
        # Compiled with the tests so CI catches its errors; not in the test action, so
        # never run here.
        JarvisRunner: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: JarvisUITests
    archive:
      config: Release

  # Starts Jarvis's own runner: one long-running UI test that serves until stopped.
  JarvisRunner:
    build:
      targets:
        Jarvis: all
        JarvisRunner: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: JarvisRunner
      environmentVariables:
        JARVIS_RUNNER_SERVE: "1"
