name: ios

# iPhone Simulator QA on a macOS runner (Shell/scripts/sim-qa.sh does the real work, so the
# same command runs on a developer Mac). macOS minutes on a private repository cost 10x
# Linux, so while the repository is private a run is opt-in per commit: put [ios-qa] in the
# head commit message, or start it from the Actions tab. Once the repository is public it
# runs on every matching push.
on:
  push:
    paths:
      - "core/**"
      - "Shell/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# The group name includes whether this run will actually do anything. A push that the job's
# `if` skips lands in its own group, so it cannot disturb a simulator run in flight.
# A simulator run takes about half an hour, longer than the gap between pushes, so a run in
# flight is never cancelled: a newer push waits (GitHub keeps only the newest waiting run).
concurrency:
  group: ios-${{ github.ref }}-${{ github.event.repository.private == false || contains(github.event.head_commit.message, '[ios-qa]') || github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simulator-qa:
    if: github.event.repository.private == false || contains(github.event.head_commit.message, '[ios-qa]') || github.event_name == 'workflow_dispatch'
    # macos-26 is the arm64 image; Xcode 26.x is installed (default 26.6 when last checked).
    # Source: https://github.com/actions/runner-images#available-images
    runs-on: macos-26
    timeout-minutes: 85
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v6

      # Cheap diagnostics first: they show at a glance which image/Xcode/runtimes we got.
      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          printf '%s\n' /Applications/Xcode*.app
          xcrun simctl list runtimes
          xcrun simctl list devices available
          rustc --version || true
          cargo --version || true
          rustup --version || true
          swift --version || true
          command -v xcodegen xcbeautify shellcheck python3 || true

      # Package.swift declares iOS 26, so Xcode 26+ is required. The image default is used
      # when it is new enough; otherwise take the newest installed Xcode 26+.
      - name: Select Xcode 26+
        run: |
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p' | head -n 1)"
          if [ "${major:-0}" -lt 26 ]; then
            newest="$(printf '%s\n' /Applications/Xcode_*.app | sed -n 's|.*/Xcode_\([0-9][0-9.]*\)\.app$|\1 &|p' | sort -V | tail -n 1 | cut -d' ' -f2-)"
            echo "default Xcode is $major; selecting $newest"
            [ -n "$newest" ] || { echo "::error::no Xcode 26+ found under /Applications"; exit 1; }
            echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
            DEVELOPER_DIR="$newest/Contents/Developer" xcodebuild -version
          else
            echo "keeping the image default Xcode $major"
          fi

      - name: Rust targets
        working-directory: core
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true

      - name: Bootstrap (Rust core, bindings, xcframework)
        timeout-minutes: 20
        run: Shell/scripts/bootstrap.sh

      - name: Swift package tests (Mac host)
        timeout-minutes: 10
        working-directory: Shell
        # On a failure or a crash of the test process the script reruns each suite on its own
        # and prints the newest crash report, so the log names the suite and the frames.
        run: scripts/host-test.sh

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      # Generates the project, builds for testing, runs the UI tests on a runtime-picked
      # simulator, exports attachments/summary to Shell/build/qa and writes the job summary.
      - name: Simulator QA (xcodegen, build-for-testing, test)
        timeout-minutes: 55
        run: Shell/scripts/sim-qa.sh --skip-bootstrap

      # Failures in the log itself: the planner reads job logs, not artifacts.
      - name: Failure details
        if: failure()
        run: |
          qa=Shell/build/qa
          [ -f "$qa/summary.md" ] && cat "$qa/summary.md"
          for f in "$qa/xcodebuild-build.log" "$qa/xcodebuild-test.log"; do
            [ -f "$f" ] || continue
            echo "::group::errors in $f"
            grep -E "error:|failed|Failing tests|Test Case .* failed|\*\* (BUILD|TEST) FAILED" "$f" | head -n 80 || true
            echo "::endgroup::"
            echo "::group::tail of $f"
            tail -n 80 "$f"
            echo "::endgroup::"
          done
          exit 0

      - name: Zip result bundles
        if: always()
        run: |
          qa=Shell/build/qa
          for b in "$qa"/*.xcresult; do
            [ -d "$b" ] || continue
            ditto -c -k --sequesterRsrc --keepParent "$b" "$b.zip"
          done
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-qa-${{ github.run_number }}
          path: |
            Shell/build/qa/**
            !Shell/build/qa/*.xcresult
            !Shell/build/qa/*.xcresult/**
          if-no-files-found: warn
          retention-days: 14
