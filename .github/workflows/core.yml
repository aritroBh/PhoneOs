name: core

on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-ios
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Check iOS target
        run: cargo check -p jarvis-ffi --target aarch64-apple-ios --no-default-features
      - name: Simulator eval (scripted)
        run: cargo run -q -p jarvis-sim -- eval builtin --strict
      - name: Swift smoke test against the Rust library
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            swiftc --version
            JARVIS_SMOKE_STATIC=1 jarvis-ffi/scripts/swift-smoke.sh
          else
            echo "::warning::swiftc not found on this runner; Swift smoke test skipped"
          fi
