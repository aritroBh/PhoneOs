name: shell

# Builds and tests the Swift package (JarvisKit) on Linux against the Rust core. The core's
# own workflow does not compile Swift beyond a smoke test, so a core change that the Swift
# side has not followed shows up here in minutes instead of on a macOS simulator run.
on:
  push:
    branches: [main]
    paths: ["core/**", "Shell/**", ".github/workflows/shell.yml"]
  pull_request:
    paths: ["core/**", "Shell/**", ".github/workflows/shell.yml"]

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jarviskit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        id: tools
        run: |
          (cd core && rustup show)
          if ! command -v swift >/dev/null 2>&1; then
            echo "::warning::swift not found on this runner; JarvisKit was not built or tested"
            echo "have_swift=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          swift --version
          major="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9]*\)\..*/\1/p' | head -n 1)"
          if [ "${major:-0}" -lt 6 ]; then
            echo "::warning::Swift ${major:-?} on this runner is older than 6; JarvisKit was not built or tested"
            echo "have_swift=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_swift=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.tools.outputs.have_swift == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: shell-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: shell-${{ runner.os }}-
      - name: Bindings and host library
        if: steps.tools.outputs.have_swift == 'true'
        working-directory: Shell
        run: scripts/bootstrap.sh
      - name: Build and test
        if: steps.tools.outputs.have_swift == 'true'
        working-directory: Shell
        # The script also refuses source patterns that only break on the Mac toolchain, and
        # on a failure reruns each suite alone. Every suite has its own time limit; the
        # timeout is the backstop for the whole run.
        run: timeout 900 scripts/host-test.sh
