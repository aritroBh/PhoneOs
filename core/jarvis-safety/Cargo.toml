[package]
name = "jarvis-safety"
description = "Safety policy, risk classification and text hygiene for the Jarvis core."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only: `jarvis_safety::reference`, the implementations faster code replaced, for the
# differential tests of other crates (jarvis-observe's dev-dependency turns it on).
reference = []

[dependencies]
jarvis-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
jarvis-proto = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
