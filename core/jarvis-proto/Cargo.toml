[package]
name = "jarvis-proto"
description = "Shared plain-data types for the Jarvis core (serde only)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `jarvis_proto::fixtures` (realistic UI trees) to other crates' tests.
test-util = []

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Enables `fixtures` for this crate's own integration tests.
jarvis-proto = { path = ".", features = ["test-util"] }
