[package]
name = "jarvis-sim"
description = "Simulated phone, scripted/HTTP models and eval CLI for the Jarvis core."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# OpenAI-compatible HTTP model client (plain http to a local server; no TLS).
http = ["dep:ureq"]

[[bin]]
name = "jarvis-sim"
path = "src/main.rs"

[dependencies]
jarvis-proto.workspace = true
jarvis-observe.workspace = true
jarvis-safety.workspace = true
jarvis-memory.workspace = true
jarvis-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "2", default-features = false, optional = true }

[dev-dependencies]
jarvis-proto = { workspace = true, features = ["test-util"] }
# End-to-end workflow test (tests/workflow.rs); a dev-dependency only, so no cycle.
jarvis-skills.workspace = true

[lints]
workspace = true
